<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random User Fetch</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
 <div class="container my-5">
    <div id="result" class="d-flex justify-content-center align-items-center">

    </div>
    <div class="text-center">
        <button onClick="fetchUserData()" class="btn btn-primary mt-5"> Random user</button>
    </div>
 </div>
</body>
<script>
    async function fetchUserData() {

        try{
             const response = await fetch("https://randomuser.me/api")
             const fetchUser = await response.json()
             console.log(fetchUser);
            const user = fetchUser.results[0]

           result.innerHTML = `
             <div class="card p-4 mx-auto">
               <img  src="${user.picture.large}" class="rounded-circle mx-auto" width="120" height="120">
               <p class='text-center'>first Name: ${user.name.first} last Name: ${user.name.last} </p>
               <p class='text-center'> Email: ${user.email} </p>
               <p class='text-center'> Location : ${user.location.city} </p>
               <p class='text-center'> phone number: ${user.phone} </p>

                </div>
           `
        }catch (error){
        console.log(error);
    }
    }
</script>
</html>
